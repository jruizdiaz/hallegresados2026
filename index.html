<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Egresados TUCEMD — Defensas Finales</title>
<style>
  :root{
    --navy:#005674;
    --navy-dark:#003b50;
    --teal:#4dd0c4;
    --gold:#e0b64a;
    --white:#ffffff;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;background:transparent;}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;padding:8px;
  }

  .carrusel{
    position:relative;width:100%;max-width:1000px;
    aspect-ratio:16/9;overflow:hidden;border-radius:14px;
    background:var(--navy-dark);
    box-shadow:0 10px 30px rgba(0,86,116,.35);
  }

  .track{
    display:flex;height:100%;
    transition:transform .7s cubic-bezier(.4,0,.2,1);
    will-change:transform;
  }
  .slide{
    min-width:100%;height:100%;position:relative;
    display:flex;align-items:center;justify-content:center;
  }
  .slide img{
    width:100%;height:100%;object-fit:contain;display:block;
    background:var(--navy-dark);
  }

  /* Flechas */
  .nav{
    position:absolute;top:50%;transform:translateY(-50%);
    width:44px;height:44px;border:none;border-radius:50%;
    background:rgba(0,86,116,.7);color:var(--white);
    font-size:22px;line-height:1;cursor:pointer;z-index:5;
    display:flex;align-items:center;justify-content:center;
    transition:background .25s,transform .15s;backdrop-filter:blur(4px);
  }
  .nav:hover{background:var(--teal);}
  .nav:active{transform:translateY(-50%) scale(.92);}
  .nav.prev{left:14px;}
  .nav.next{right:14px;}

  /* Puntos */
  .dots{
    position:absolute;bottom:14px;left:0;right:0;
    display:flex;justify-content:center;gap:8px;z-index:5;
  }
  .dot{
    width:11px;height:11px;border-radius:50%;cursor:pointer;
    background:rgba(255,255,255,.45);border:2px solid transparent;
    transition:all .25s;padding:0;
  }
  .dot.active{background:var(--teal);border-color:var(--white);transform:scale(1.15);}

  /* Contador */
  .contador{
    position:absolute;top:14px;right:16px;z-index:5;
    background:rgba(0,59,80,.75);color:var(--white);
    font-size:13px;font-weight:600;padding:5px 12px;border-radius:20px;
    letter-spacing:.5px;backdrop-filter:blur(4px);
  }

  @media (max-width:600px){
    .nav{width:36px;height:36px;font-size:18px;}
    .nav.prev{left:8px;} .nav.next{right:8px;}
    .contador{font-size:11px;padding:4px 9px;}
  }
  @media (prefers-reduced-motion:reduce){
    .track{transition:none;}
  }
</style>
</head>
<body>
<div class="carrusel" id="carrusel">
  <div class="track" id="track"></div>
  <button class="nav prev" id="prev" aria-label="Anterior">‹</button>
  <button class="nav next" id="next" aria-label="Siguiente">›</button>
  <div class="contador" id="contador"></div>
  <div class="dots" id="dots"></div>
</div>

<script>
  /* ============================================================
     FLYERS — editá solo esta lista.
     Agregá o sacá líneas; el carrusel se adapta solo.
     src: nombre del archivo (subilo al mismo repo) o URL completa.
     ============================================================ */
  const FLYERS = [
    { src: "Primeros Egresados TUCEMD.png", alt: "Primeros egresados TUCEMD — Grupo URBIX" },
    { src: "Egreso Grupo 77.png", alt: "Grupo 77 - Garritas Club" },
    { src: "Egreso Grupo 7.png", alt: "Grupo 7 - NooMind" },
    // { src: "flyer_grupo3.png", alt: "Grupo 3 — ..." },
  ];

  const INTERVALO = 5000;   // ms entre flyers (autoplay)
  const AUTOPLAY   = true;

  /* ---------- lógica ---------- */
  const track = document.getElementById('track');
  const dotsBox = document.getElementById('dots');
  const contador = document.getElementById('contador');
  let idx = 0, timer = null;

  FLYERS.forEach((f, i) => {
    const s = document.createElement('div');
    s.className = 'slide';
    s.innerHTML = `<img src="${f.src}" alt="${f.alt || 'Flyer ' + (i+1)}" loading="${i===0?'eager':'lazy'}">`;
    track.appendChild(s);

    const d = document.createElement('button');
    d.className = 'dot' + (i===0 ? ' active' : '');
    d.setAttribute('aria-label', 'Ir al flyer ' + (i+1));
    d.addEventListener('click', () => { ir(i); reiniciar(); });
    dotsBox.appendChild(d);
  });

  function actualizar(){
    track.style.transform = `translateX(-${idx*100}%)`;
    dotsBox.querySelectorAll('.dot').forEach((d,i) => d.classList.toggle('active', i===idx));
    contador.textContent = `${idx+1} / ${FLYERS.length}`;
  }
  function ir(n){ idx = (n + FLYERS.length) % FLYERS.length; actualizar(); }
  function siguiente(){ ir(idx+1); }
  function anterior(){ ir(idx-1); }

  document.getElementById('next').addEventListener('click', () => { siguiente(); reiniciar(); });
  document.getElementById('prev').addEventListener('click', () => { anterior(); reiniciar(); });

  function arrancar(){ if(AUTOPLAY && FLYERS.length>1){ timer = setInterval(siguiente, INTERVALO); } }
  function reiniciar(){ clearInterval(timer); arrancar(); }

  const cont = document.getElementById('carrusel');
  cont.addEventListener('mouseenter', () => clearInterval(timer));
  cont.addEventListener('mouseleave', arrancar);

  // Teclado
  document.addEventListener('keydown', e => {
    if(e.key==='ArrowRight'){ siguiente(); reiniciar(); }
    if(e.key==='ArrowLeft'){ anterior(); reiniciar(); }
  });

  // Ocultar controles si hay un solo flyer
  if(FLYERS.length<=1){
    document.getElementById('prev').style.display='none';
    document.getElementById('next').style.display='none';
    dotsBox.style.display='none';
  }

  actualizar();
  arrancar();
</script>
</body>
</html>
